name: Package skills on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build per-skill zips
        run: |
          set -euo pipefail
          mkdir -p dist
          # Explicit allowlist of paths that may ship in a skill package.
          # Add an entry here if a skill needs to distribute a new file/dir.
          ALLOW=(SKILL.md references scripts assets)
          for skill in */; do
            skill="${skill%/}"
            [ -f "$skill/SKILL.md" ] || continue
            paths=()
            for entry in "${ALLOW[@]}"; do
              [ -e "$skill/$entry" ] && paths+=("$skill/$entry")
            done
            # Zip so the archive extracts to "<skill>/SKILL.md" — the valid,
            # directly-installable skill layout.
            zip -r "dist/$skill.zip" "${paths[@]}"
            echo "Packaged $skill: ${paths[*]}"
          done

      - name: Attach zips to release
        run: gh release upload "$TAG" dist/*.zip --clobber
