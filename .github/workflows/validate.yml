name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Deliberately unpinned: the SHA-pinning rule covers marketplace actions
      # only. New schema rules should fail this gate early, not silently pass
      # against a stale CLI.
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      # `validate .` checks only .claude-plugin/marketplace.json — it does not
      # recurse into plugins/. Without this loop a malformed plugin.json passes.
      - name: Validate each plugin manifest
        run: |
          set -euo pipefail
          for plugin in plugins/*/; do
            claude plugin validate --strict "${plugin%/}"
          done
